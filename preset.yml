schema_version: "1.0"

preset:
  id: "sdd-workflow"
  name: "SDD Workflow"
  version: "3.0.0"
  description: "Adaptive SDD workflow with milestone approvals, consolidated tasks, incremental analysis, deterministic local checks, atomic commits and independent final review."
  author: "Felipe Faustini"
  repository: "https://github.com/fabfdev/spec-kit-preset-sdd-workflow"
  license: "MIT"

requires:
  speckit_version: ">=0.9.0"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Create a feature-level PRD under specs/[slug]/, with clarifying questions, an approval gate, and a docs/kanban/feature-[slug].md tracking entry"
      replaces: "speckit.specify"

    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Resolve remaining PRD decisions in grouped rounds and patch affected sections"
      replaces: "speckit.clarify"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Create a technical specification (techspec) for a feature that already has a PRD"
      replaces: "speckit.plan"

    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Validate cross-artifact consistency between prd.md, techspec.md, and tasks.md. Persistent incremental review and targeted corrections."
      replaces: "speckit.analyze"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Create consolidated tasks and approve technical decisions and task plan together"
      replaces: "speckit.tasks"

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Implement one task at a time with test gate, continuous approved execution, atomic tracking, and independent final review"
      replaces: "speckit.implement"

tags:
  - "sdd"
  - "workflow"
  - "prd"
  - "techspec"
  - "tasks"
