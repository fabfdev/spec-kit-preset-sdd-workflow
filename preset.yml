schema_version: "1.0"

preset:
  id: "sdd-workflow"
  name: "SDD Workflow"
  version: "4.0.0"
  description: "Lean SDD workflow: feature PRD with RF/AC IDs, techspec, one consolidated tasks plan, one task per session with a test gate and one commit, human approval of PRD, techspec and tasks. Tracking in docs/kanban/. No external services."
  author: "Felipe Faustini"
  repository: "https://github.com/fabfdev/spec-kit-preset-sdd-workflow"
  license: "MIT"

requires:
  speckit_version: ">=0.9.0"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Create a feature PRD with one round of clarifying questions, an approval gate, a worktree and a docs/kanban/ entry"
      replaces: "speckit.specify"

    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Optional: revisit an existing PRD with up to 5 targeted questions"
      replaces: "speckit.clarify"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Create the techspec for a full-size feature that already has an approved PRD"
      replaces: "speckit.plan"

    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Optional read-only, single-pass consistency check of PRD, techspec and tasks"
      replaces: "speckit.analyze"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Create one consolidated task plan with RF/AC traceability and gates, approved before saving"
      replaces: "speckit.tasks"

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Implement exactly one task with a test gate and a single commit, then stop for /clear"
      replaces: "speckit.implement"

tags:
  - "sdd"
  - "workflow"
  - "prd"
  - "techspec"
  - "tasks"
